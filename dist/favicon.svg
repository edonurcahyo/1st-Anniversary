<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a"/>
      <stop offset="50%" stopColor="#1e3a8a"/>
      <stop offset="100%" stopColor="#0a192f"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff"/>
      <stop offset="40%" stopColor="#dbeafe"/>
      <stop offset="80%" stopColor="#60a5fa"/>
      <stop offset="100%" stopColor="#2563eb"/>
    </linearGradient>
    <radialGradient id="sapphireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#93c5fd" stopOpacity="0.8"/>
      <stop offset="70%" stopColor="#2563eb" stopOpacity="0.2"/>
      <stop offset="100%" stopColor="#0a192f" stopOpacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Royal Midnight Navy Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#navyBg)"/>
  
  <!-- Subtle Outer Silver Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#sapphireGlow)"/>

  <!-- Luminous Heart Emblem -->
  <path d="M32 50C16 38 12 28 12 21a10 10 0 0 1 20-2 10 10 0 0 1 20 2c0 7-4 17-20 29Z" 
        fill="url(#heartGrad)" 
        stroke="#ffffff" 
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Inner Sparkle Highlight -->
  <path d="M26 19c-3 1-5 4-5 6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Top Star Accent -->
  <circle cx="48" cy="16" r="1.5" fill="#ffffff"/>
  <circle cx="16" cy="46" r="1" fill="#93c5fd"/>
</svg>
